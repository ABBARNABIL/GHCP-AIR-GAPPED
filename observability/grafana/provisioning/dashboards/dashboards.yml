# Grafana dashboard provisioning — loads every JSON in /var/lib/grafana/dashboards.
apiVersion: 1

providers:
  - name: ollama-copilot
    orgId: 1
    folder: "Ollama / Copilot CLI"
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
