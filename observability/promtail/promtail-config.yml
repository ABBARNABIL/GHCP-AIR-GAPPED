# Promtail — discovers the Ollama container via the Docker Engine API and ships
# its raw logs to Loki under job="ollama". No host log-file paths needed; works
# on Docker Desktop / WSL2 by mounting the docker socket (read-only).
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: ollama-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # keep only the Ollama container
      - source_labels: ["__meta_docker_container_name"]
        regex: "/?ollama"
        action: keep
      - source_labels: ["__meta_docker_container_name"]
        regex: "/?(.*)"
        target_label: container
        replacement: "$1"
      - target_label: job
        replacement: ollama
